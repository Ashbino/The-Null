name: Build TheNull

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Gradle project
        id: locate
        run: |
          file=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$file" ]; then
            echo "::error::settings.gradle not found anywhere in the repository."
            exit 1
          fi
          echo "dir=$(dirname "$file")" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build plugin
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          set +e
          gradle build --console=plain --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            {
              echo "## Build errors"
              echo '```'
              grep -n -E "error:|warning: \[|What went wrong|Could not|> Task .* FAILED" -A4 build.log | head -n 120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::group::KEY ERRORS"
            grep -n -E "error:|What went wrong|Could not" -A4 build.log | head -n 120
            echo "::endgroup::"
          fi
          exit $status

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TheNull-jar
          path: ${{ steps.locate.outputs.dir }}/build/libs/TheNull-*.jar
          if-no-files-found: error
