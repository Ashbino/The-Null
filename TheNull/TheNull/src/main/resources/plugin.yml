name: TheNull
version: '${version}'
main: com.thegildedking.thenull.TheNullPlugin
api-version: '1.21'
description: The Null faction - invitation-only transformation, commanders and the Totem of Null.
author: TheGildedKing
commands:
  null:
    description: Manage The Null
    usage: /null <transform|remove|commander|give|info|list|setskin|reload>
    aliases: [thenull]
permissions:
  thenull.admin:
    description: Full plugin administration
    default: op
    children:
      thenull.transform: true
      thenull.commander: true
      thenull.totem: true
  thenull.transform:
    description: Manually transform and remove Null players
    default: op
  thenull.commander:
    description: Assign and remove commanders
    default: op
  thenull.totem:
    description: Give Totems of Null
    default: op
